[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  topics = [
    "valenbisi/stations"
  ]

  data_format = "json"

  tag_keys = [
    "station"
  ]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]

  token = "valenbisi-token"

  organization = "valenbisi"

  bucket = "valenbisi"
