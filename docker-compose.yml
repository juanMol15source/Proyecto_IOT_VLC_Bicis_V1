services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: valenbisi-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  influxdb:
    image: influxdb:2
    container_name: valenbisi-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: valenbisi
      DOCKER_INFLUXDB_INIT_BUCKET: valenbisi
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: valenbisi-token
  telegraf:
    image: telegraf:1.36
    container_name: valenbisi-telegraf
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  collector:
    build: ./collector
    container_name: valenbisi-collector
    depends_on:
      - mosquitto
  grafana:
    image: grafana/grafana:latest
    container_name: valenbisi-grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
